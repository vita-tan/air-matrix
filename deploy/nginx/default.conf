# air-matrix 前端反代 / TLS 终止 / 静态托管
# 说明：证书由 certbot 写入 dji_certs 卷（挂载到 /etc/letsencrypt）。
#       若临时用自签占位证书，请把 cert 放到同样路径。

# ---------- HTTP：ACME 挑战直出 + 其余 301 跳 HTTPS ----------
server {
    listen 80;
    server_name air-matrix.crmappai.xyz;

    # Let's Encrypt HTTP-01 挑战目录（certbot --webroot -w /var/www/certbot）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余全部 301 跳 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS ----------
server {
    listen 443 ssl;
    server_name air-matrix.crmappai.xyz;

    ssl_certificate     /etc/letsencrypt/live/air-matrix.crmappai.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/air-matrix.crmappai.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全加固
    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;

    # 前端静态资源（SPA）
    root /usr/share/nginx/html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API（含 SignalR /hubs 的 WebSocket 升级）
    # 覆盖 /api /kapi /net /hubs /upload（大小写不敏感）
    location ~* ^/(api|kapi|net|hubs|upload)/ {
        proxy_pass http://air-matrix-backend:5005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;
    }

    # 流媒体 HTTP-FLV / HLS（保留 /live 前缀，node-media-server 的 app 名即 live）
    location /live/ {
        proxy_pass http://air-matrix-media:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # MinIO S3（path-style）：去掉 /minio 前缀，Host 透传（匿名读/兼容旧链接）
    # 后端 Upload.json: Endpoint=air-matrix-minio:9000(内网), PublicBaseUrl=https://air-matrix.crmappai.xyz
    # 公开 URL = https://air-matrix.crmappai.xyz/minio/dji-media/... -> 去 /minio -> minio:9000/dji-media/...
    location /minio/ {
        proxy_pass http://air-matrix-minio:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 0;
        proxy_read_timeout 3600s;
    }

    # 机场直传入口：保留原始路径，SigV4 的 CanonicalURI 必须与 MinIO 收到的路径一致
    location /dji-media/ {
        proxy_pass http://air-matrix-minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
