# ============================================================
#  air-matrix 无人机智控系统 · 宿主 nginx 站点
#  由宿主 nginx 做 TLS 终止 + 反代到 Docker 容器（127.0.0.1 端口）
#  证书由 certbot --nginx -d air-matrix.crmappai.xyz 自动追加 443 配置
#  ⚠️ 本文件只服务 air-matrix.crmappai.xyz，不影响其他站点
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name air-matrix.crmappai.xyz;

    # ACME http-01 挑战（webroot 方式兼容）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 前端静态（build-frontend.sh 产出到 dji_vue/dist）
    root /opt/air-matrix/dji_vue/dist;
    index index.html;
    client_max_body_size 200m;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API（/api /kapi /net /hubs /upload）
    location ~* ^/(api|kapi|net|hubs|upload)/ {
        proxy_pass http://127.0.0.1:5005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SignalR / WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 流媒体（HTTP-FLV / HLS），保留 /live 前缀
    location /live/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # MinIO 对象存储（去 /minio 前缀，path-style）
    location /minio/ {
        proxy_pass http://127.0.0.1:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 500m;
    }
}
