# ============================================================
#  air-matrix 无人机智控系统 · 生产编排（Docker Compose）
# ------------------------------------------------------------
#  公网开放端口：80/443/1883/1935（腾讯云安全组放行）
#  仅内网端口：5005(backend) / 8000(media HTTP-FLV) / 9000,9001(MinIO) / 5432(PostgreSQL)
#
#  敏感配置经 deploy/.env + deploy/config/* 注入（均 gitignore，禁止提交）。
#  运行前请先：cp deploy/.env.example deploy/.env 并填真实值；
#             cp dji_server/docs/config-template/* deploy/config/ 并改真实值；
#             bash deploy/scripts/build-frontend.sh 产出 dji_vue/dist。
#  标准起停请用 deploy/scripts/up.sh / down.sh（会自动 source deploy/.env）。
# ============================================================

services:
  # ---------- PostgreSQL 16（业务库，仅内网） ----------
  air-matrix-postgres:
    image: postgres:16-alpine
    container_name: air-matrix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dji}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 deploy/.env 设置 POSTGRES_PASSWORD}
      # POSTGRES_DB 留空：由 init.sql 预建 dji_admin / dji_log 两个库
      TZ: Asia/Shanghai
    volumes:
      - dji_pg:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-dji} -d dji_admin"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - air-net
    # 5432 不映射公网，仅内网互通

  # ---------- MinIO（对象存储，仅内网，经 nginx /minio 反代） ----------
  air-matrix-minio:
    image: minio/minio:RELEASE.2025-07-23
    container_name: air-matrix-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-DJICLOUD}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在 deploy/.env 设置 MINIO_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - dji_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - air-net
    # 9000/9001 不映射公网，仅经 nginx 反代暴露 /minio

  # ---------- MinIO 初始化（一次性：建桶 + 匿名读策略 + djicloud 账号） ----------
  air-matrix-minio-init:
    image: minio/mc:latest
    container_name: air-matrix-minio-init
    restart: "no"
    depends_on:
      air-matrix-minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-DJICLOUD}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在 deploy/.env 设置 MINIO_ROOT_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-djicloud}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?请在 deploy/.env 设置 MINIO_SECRET_KEY}
    volumes:
      - dji_minio:/data
      - ./deploy/minio/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "-c", "/init.sh"]
    networks:
      - air-net

  # ---------- MQTT（aedes 加固，公网 1883） ----------
  air-matrix-mqtt:
    build:
      context: ./services
      dockerfile: Dockerfile.mqtt
    container_name: air-matrix-mqtt
    restart: unless-stopped
    environment:
      MQTT_PORT: 1883
      MQTT_USERNAME: ${MQTT_USERNAME:?请在 deploy/.env 设置 MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?请在 deploy/.env 设置 MQTT_PASSWORD}
    ports:
      - "1883:1883"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').connect(1883,'127.0.0.1',function(){process.exit(0)}).on('error',function(){process.exit(1)})\""]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - air-net

  # ---------- 流媒体（node-media-server + ffmpeg，公网 1935 / 内网 8000） ----------
  air-matrix-media:
    build:
      context: ./services
      dockerfile: Dockerfile.media
    container_name: air-matrix-media
    restart: unless-stopped
    environment:
      RTMP_PORT: 1935
      MEDIA_HTTP_PORT: 8000
      MEDIA_ROOT: /app/media
      FFMPEG_PATH: ffmpeg
    ports:
      - "1935:1935"
      # 8000 不映射公网，仅经 nginx /live 反代
    volumes:
      - dji_hls:/app/media
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').connect(8000,'127.0.0.1',function(){process.exit(0)}).on('error',function(){process.exit(1)})\""]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - air-net

  # ---------- 后端 dji_server（.NET 10 多阶段，仅内网 5005） ----------
  air-matrix-backend:
    build:
      context: ./dji_server
      dockerfile: Dji.Web.Entry/Dockerfile
    container_name: air-matrix-backend
    restart: unless-stopped
    depends_on:
      air-matrix-postgres:
        condition: service_healthy
      air-matrix-minio:
        condition: service_healthy
      air-matrix-mqtt:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      # 数据库连接 / OSS / DJI / JWT 等均在挂载的 deploy/config 下
    volumes:
      - ./deploy/config:/app/Configuration:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5005/ -T 3 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - air-net
    # 5005 不映射公网，仅经 nginx 反代

  # ---------- nginx（唯一公网 HTTP 入口：TLS 终止 + 静态 + 反代） ----------
  air-matrix-nginx:
    image: nginx:1.27-alpine
    container_name: air-matrix-nginx
    restart: unless-stopped
    depends_on:
      - air-matrix-backend
      - air-matrix-media
      - air-matrix-minio
      - air-matrix-postgres
      - air-matrix-mqtt
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - dji_certs:/etc/letsencrypt
      - dji_www:/var/www/certbot
      # 前端静态资源：由 build-frontend.sh 构建 dist 后写入 dji_dist 命名卷（只读挂载）
      - dji_dist:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ -T 3 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - air-net

  # ---------- certbot（Let's Encrypt，按需 run --rm） ----------
  air-matrix-certbot:
    image: certbot/certbot:latest
    container_name: air-matrix-certbot
    restart: "no"
    depends_on:
      - air-matrix-nginx
    volumes:
      - dji_certs:/etc/letsencrypt
      - dji_www:/var/www/certbot
    # entrypoint 固定为 certbot：`docker compose run --rm air-matrix-certbot certonly ...` 会覆盖 command。
    # 默认 command 仅打印版本（`up -d` 时该容器启动即退出，不常驻）。
    entrypoint: ["certbot"]
    command: ["--version"]
    networks:
      - air-net

volumes:
  # 显式命名：便于备份脚本与前端 dist 拷贝脚本稳定引用（与 compose 项目名解耦）
  dji_pg:
    name: air_matrix_pg
  dji_minio:
    name: air_matrix_minio_data
  dji_hls:
    name: air_matrix_hls
  dji_certs:
    name: air_matrix_certs
  dji_www:
    name: air_matrix_www
  dji_dist:
    name: air_matrix_dist

networks:
  air-net:
    driver: bridge
