# ============================================================
#  air-matrix 无人机智控系统 · 生产编排（Docker Compose）
# ------------------------------------------------------------
#  ⚠️ 本服务器为多站点生产机：宿主机 nginx 已占用 80/443（homework / nongbao /
#  crmappai / stock / zj-agr 等站点），certbot 已管理多张证书。
#  因此本编排【不含 nginx / certbot】：由宿主机 nginx 为 air-matrix.crmappai.xyz
#  做 TLS 终止与反向代理，容器仅以 127.0.0.1 端口暴露给宿主机 nginx：
#     backend 127.0.0.1:5005 / media 127.0.0.1:8000 / minio 127.0.0.1:9000
#  公网端口仅：1883(MQTT 机场) / 1935(RTMP 机场)。
#  宿主机 nginx 配置见 /etc/nginx/conf.d/air-matrix.conf。
#
#  敏感配置经 deploy/.env + deploy/config/* 注入（均 gitignore，禁止提交）。
#  标准起停请用 deploy/scripts/up.sh / down.sh（会自动 source deploy/.env）。
# ============================================================

services:
  # ---------- PostgreSQL 16（业务库，仅内网） ----------
  air-matrix-postgres:
    image: postgres:16-alpine
    container_name: air-matrix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dji}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 deploy/.env 设置 POSTGRES_PASSWORD}
      # POSTGRES_DB 留空：由 init.sql 预建 dji_admin / dji_log 两个库
      TZ: Asia/Shanghai
    volumes:
      - dji_pg:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-dji} -d dji_admin"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - air-net
    # 5432 不映射，仅内网互通

  # ---------- MinIO（对象存储，仅 127.0.0.1，经宿主 nginx /minio 反代） ----------
  air-matrix-minio:
    build:
      context: ./deploy/minio
      dockerfile: Dockerfile.minio
    container_name: air-matrix-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-DJICLOUD}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在 deploy/.env 设置 MINIO_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - dji_minio:/data
    ports:
      # 仅宿主机 nginx 访问；9001 控制台不对外
      - "127.0.0.1:9000:9000"
    healthcheck:
      # 自建 minio 镜像不含 mc，改用 TCP 探测 9000 端口
      test: ["CMD-SHELL", "nc -z localhost 9000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - air-net

  # ---------- MinIO 初始化（一次性：建桶 + 匿名读策略 + djicloud 账号） ----------
  air-matrix-minio-init:
    build:
      context: ./deploy/minio
      dockerfile: Dockerfile.mc
    container_name: air-matrix-minio-init
    restart: "no"
    depends_on:
      air-matrix-minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-DJICLOUD}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在 deploy/.env 设置 MINIO_ROOT_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-djicloud}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?请在 deploy/.env 设置 MINIO_SECRET_KEY}
    volumes:
      - dji_minio:/data
      - ./deploy/minio/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "-c", "/init.sh"]
    networks:
      - air-net

  # ---------- MQTT（aedes 加固，公网 1883） ----------
  air-matrix-mqtt:
    build:
      context: ./services
      dockerfile: Dockerfile.mqtt
    container_name: air-matrix-mqtt
    restart: unless-stopped
    environment:
      MQTT_PORT: 1883
      MQTT_USERNAME: ${MQTT_USERNAME:?请在 deploy/.env 设置 MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?请在 deploy/.env 设置 MQTT_PASSWORD}
    ports:
      - "1883:1883"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').connect(1883,'127.0.0.1',function(){process.exit(0)}).on('error',function(){process.exit(1)})\""]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - air-net

  # ---------- 流媒体（node-media-server + ffmpeg，公网 1935 / 127.0.0.1:8000） ----------
  air-matrix-media:
    build:
      context: ./services
      dockerfile: Dockerfile.media
    container_name: air-matrix-media
    restart: unless-stopped
    environment:
      RTMP_PORT: 1935
      MEDIA_HTTP_PORT: 8000
      MEDIA_ROOT: /app/media
      FFMPEG_PATH: ffmpeg
    ports:
      - "1935:1935"
      # 8000 仅宿主机 nginx 访问（/live 反代）
      - "127.0.0.1:8000:8000"
    volumes:
      - dji_hls:/app/media
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').connect(8000,'127.0.0.1',function(){process.exit(0)}).on('error',function(){process.exit(1)})\""]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - air-net

  # ---------- 后端 dji_server（.NET 10 多阶段，仅 127.0.0.1:5005） ----------
  air-matrix-backend:
    build:
      context: ./dji_server
      dockerfile: Dji.Web.Entry/Dockerfile
    container_name: air-matrix-backend
    restart: unless-stopped
    depends_on:
      air-matrix-postgres:
        condition: service_healthy
      air-matrix-minio:
        condition: service_healthy
      air-matrix-mqtt:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./deploy/config:/app/Configuration:ro
    ports:
      # 仅宿主机 nginx 访问
      - "127.0.0.1:5005:5005"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5005/ -T 3 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - air-net

volumes:
  dji_pg:
    name: air_matrix_pg
  dji_minio:
    name: air_matrix_minio_data
  dji_hls:
    name: air_matrix_hls

networks:
  air-net:
    driver: bridge
